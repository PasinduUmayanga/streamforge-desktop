version: 1.0.{build}

image: Visual Studio 2022

platform:
  - x86
  - x64

configuration:
  - Release

environment:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_INSTALL_DIR: '%USERPROFILE%\.dotnet'
  PLAYWRIGHT_BROWSERS_PATH: '%USERPROFILE%\.cache\ms-playwright'
  PLAYWRIGHT_SKIP_BROWSER_GC: 1

cache:
  - '%USERPROFILE%\.dotnet -> appveyor.yml'
  - '%USERPROFILE%\.nuget\packages -> **\*.csproj, **\packages.lock.json'
  - '%USERPROFILE%\.cache\ms-playwright -> src\StreamForge.Infrastructure\StreamForge.Infrastructure.csproj, scripts\setup.ps1'
  - '.tools\ffmpeg -> scripts\setup.ps1'

install:
  - ps: |
      $dotnetRoot = "$env:USERPROFILE\.dotnet"
      $dotnetExe = Join-Path $dotnetRoot "dotnet.exe"
      if (-not (Test-Path $dotnetExe)) {
        New-Item -ItemType Directory -Force -Path $dotnetRoot | Out-Null
        $installer = Join-Path $env:TEMP "dotnet-install.ps1"
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
        & $installer -Channel 10.0 -InstallDir $dotnetRoot -Architecture x64
      }
      $env:PATH = "$dotnetRoot;$env:PATH"
      Set-AppveyorBuildVariable -Name PATH -Value $env:PATH
      Set-AppveyorBuildVariable -Name DOTNET_ROOT -Value $dotnetRoot
  - ps: dotnet --info

before_build:
  - ps: pwsh -NoProfile -File scripts\setup.ps1 -Configuration $env:CONFIGURATION -Platform $env:PLATFORM -ForceLocalFfmpeg

build_script:
  - ps: dotnet build StreamForge.sln --configuration $env:CONFIGURATION --no-restore /p:Platform=$env:PLATFORM

test_script:
  - ps: |
      dotnet test tests\StreamForge.Infrastructure.Tests\StreamForge.Infrastructure.Tests.csproj `
        --configuration $env:CONFIGURATION `
        --no-build `
        --no-restore `
        /p:Platform=AnyCPU `
        --logger "trx;LogFileName=Infrastructure.Tests.trx"
      if ($LASTEXITCODE -ne 0) {
        throw "Tests failed. StreamForge will not be published."
      }

      Set-Content -Path .appveyor-tests-passed -Value $env:APPVEYOR_BUILD_VERSION

after_test:
  - ps: |
      if (-not (Test-Path .appveyor-tests-passed)) {
        throw "The test success gate was not created. StreamForge will not be published."
      }

      $runtimeIdentifier = if ($env:PLATFORM -eq "x86") { "win-x86" } else { "win-x64" }
      $publishOutput = "artifacts\StreamForge-$runtimeIdentifier"
      dotnet publish src\StreamForge.App\StreamForge.App.csproj `
        --configuration $env:CONFIGURATION `
        --runtime $runtimeIdentifier `
        /p:Platform=$env:PLATFORM `
        --no-restore `
        --output $publishOutput
      if ($LASTEXITCODE -ne 0) {
        throw "StreamForge $runtimeIdentifier publish failed."
      }

artifacts:
  - path: artifacts\StreamForge-win-*
    name: StreamForge-win-%PLATFORM%
    type: zip
  - path: tests\**\TestResults\*.trx
    name: test-results

on_finish:
  - ps: |
      $results = Resolve-Path tests\**\TestResults\*.trx -ErrorAction SilentlyContinue
      if ($results) {
        $wc = New-Object System.Net.WebClient
        foreach ($result in $results) {
          $wc.UploadFile("https://ci.appveyor.com/api/testresults/mstest/$($env:APPVEYOR_JOB_ID)", $result)
        }
      }
